<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexaOS Boot — Nexa-16 OS Runner</title>
  <style>
/* NexaOS Boot — retro terminal styling */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111;--panel:#1a1a2e;--border:#333;--fg:#c8c8c8;
  --accent:#0f0;--accent-dim:#0a0;--warn:#fa0;--err:#f44;
  --mono:'Consolas','Courier New',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px;overflow:hidden}

/* Layout */
.os-shell{display:flex;flex-direction:column;height:100vh}
.os-topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.os-topbar h1{font-size:16px;color:var(--accent);letter-spacing:1px}
.os-topbar .sub{font-size:11px;color:#666;margin-left:12px}

/* Main area */
.os-main{flex:1;display:flex;overflow:hidden}

/* Setup panel (left) */
.setup-panel{width:520px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel);overflow-y:auto;flex-shrink:0;transition:width .3s}
.setup-panel.collapsed{width:0;overflow:hidden;border-right:none}
.setup-section{display:flex;flex-direction:column;flex:1;min-height:0}
.setup-section h3{padding:6px 12px;font-size:12px;color:var(--accent-dim);background:#151528;border-bottom:1px solid var(--border);cursor:default;display:flex;justify-content:space-between;align-items:center}
.setup-section h3 span.tag{font-size:10px;background:var(--accent-dim);color:#000;padding:1px 6px;border-radius:3px}
.setup-section textarea{flex:1;resize:none;background:#0d0d1a;color:var(--fg);border:none;padding:8px 12px;font-family:var(--mono);font-size:13px;line-height:1.5;outline:none;tab-size:4;min-height:120px}
.setup-section textarea:focus{background:#0f0f22}

/* Screen area (right) */
.screen-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden}
.monitor-frame{border:3px solid #333;border-radius:8px;background:#000;padding:0;box-shadow:0 0 40px rgba(0,255,0,.05);display:flex;align-items:center;justify-content:center;width:calc(100% - 24px);height:calc(100% - 40px);overflow:hidden}
.monitor-frame canvas{display:block;image-rendering:pixelated;cursor:crosshair;width:100%;height:100%;object-fit:contain}
/* CRT scanline effect */
.monitor-frame canvas{
  background:#000;
}

/* Bottom bar */
.os-bottom{display:flex;align-items:center;gap:12px;padding:6px 16px;background:var(--panel);border-top:1px solid var(--border);font-size:12px}
.os-bottom .status{flex:1;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.os-bottom .status.error{color:var(--err)}

/* Buttons */
button{font-family:var(--mono);font-size:12px;padding:4px 14px;border:1px solid var(--border);background:#222;color:var(--fg);cursor:pointer;border-radius:3px;transition:background .15s}
button:hover{background:#333}
button.primary{background:var(--accent-dim);color:#000;border-color:var(--accent-dim);font-weight:bold}
button.primary:hover{background:var(--accent)}
button.danger{border-color:#a33;color:#f88}
button.danger:hover{background:#411}

/* Toolbar */
.toolbar{display:flex;gap:6px;align-items:center}
.toolbar label{color:#888;font-size:11px}

/* Error panel */
.error-panel{display:none;max-height:120px;overflow-y:auto;background:#1a0000;border-top:1px solid #600;padding:8px 12px;font-size:12px;color:var(--err);white-space:pre-wrap}
.error-panel.visible{display:block}

/* Toggle button for sidebar */
.toggle-setup{position:absolute;left:4px;top:50%;transform:translateY(-50%);z-index:10;background:var(--panel);border:1px solid var(--border);color:var(--fg);padding:8px 4px;cursor:pointer;border-radius:0 4px 4px 0;font-size:16px;line-height:1}

/* Keyboard hint */
.kb-hint{position:absolute;bottom:8px;right:12px;font-size:10px;color:#444}

/* Responsive */
@media(max-width:900px){
  .setup-panel{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
  .os-main{flex-direction:column}
}

  </style>
</head>

          <h3>Bootloader <span class="tag">ASM</span></h3>
          <textarea id="bootloaderEditor" spellcheck="false">; ============================================================
; NexaOS v2.1 Boot Loader - boot.asm
; Nexa ASM
;
; First-stage boot loader for NexaOS.
; Initializes hardware, clears the screen, shows boot splash
; with hardware detection messages, then jumps to the VM
; bootstrap which starts the Nexa OS kernel.
;
; Memory layout:
;   RAM[0x0002] = cursor variable (framebuffer address)
;   Stack: 0xEBF0 (grows downward)
;
; Framebuffer: 0xEC00 (80x30 text cells)
; Cell format: (bg<<12) | (fg<<8) | ascii
;   Example: 0x0F48 = black bg, white fg, 'H'
;            0x1F48 = blue bg,  white fg, 'H'
; ============================================================

.EQU DISP_CTRL,    0xFF30    ; Display mode register (0=text, 1=pixel)
.EQU FRAMEBUF,     0xEC00    ; Start of framebuffer
.EQU FRAMEBUF_END, 0xF560    ; End of framebuffer (0xEC00 + 2400)
.EQU STACK_TOP,    0xEBF0    ; Stack grows down from here
.EQU CURSOR_VAR,   0x0002    ; RAM address holding current cursor

; ============================================================
; RESET VECTOR / ENTRY POINT (address 0x0000)
; ============================================================

reset:
    ; --- Initialize stack pointer ---
    LDA SP, STACK_TOP

    ; --- Switch to text mode ---
    LDA A, DISP_CTRL
    CLR D
    STORE D, [A]

    ; --- Initialize cursor to framebuffer start ---
    LDA A, CURSOR_VAR
    LDA D, FRAMEBUF
    STORE D, [A]

    ; --------------------------------------------------------
    ; CLEAR SCREEN
    ; Fill 0xEC00..0xF55F with 0x0720 (black bg, gray fg, space)
    ; Classic dark DOS look.
    ; --------------------------------------------------------
    LDA A, FRAMEBUF
    LDA D, 0x0720
cls_loop:
    STORE D, [A]
    INC A
    PUSH D
    LDA D, FRAMEBUF_END
    CMP A, D
    POP D
    BRN cls_loop

    ; --------------------------------------------------------
    ; HEADER ROW (row 0)
    ; Fill row 0 (80 cells) with 0x1F20 (blue bg, white fg, space)
    ; --------------------------------------------------------
    LDA A, FRAMEBUF
    LDA D, 0x1F20
hdr_fill:
    STORE D, [A]
    INC A
    PUSH D
    LDA D, 0xEC50
    CMP A, D
    POP D
    BRN hdr_fill

    ; Write "  NexaOS v2.1  " at col 32 (white on blue)
    ; 0xEC00 + 32 = 0xEC20
    LDA A, 0xEC20
    LDA D, 0x1F20 ; ' '
    STORE D, [A+0]
    STORE D, [A+1]
    LDA D, 0x1F4E ; 'N'
    STORE D, [A+2]
    LDA D, 0x1F65 ; 'e'
    STORE D, [A+3]
    LDA D, 0x1F78 ; 'x'
    STORE D, [A+4]
    LDA D, 0x1F61 ; 'a'
    STORE D, [A+5]
    LDA D, 0x1F4F ; 'O'
    STORE D, [A+6]
    LDA D, 0x1F53 ; 'S'
    STORE D, [A+7]
    LDA D, 0x1F20 ; ' '
    STORE D, [A+8]
    LDA D, 0x1F20 ; ' '
    STORE D, [A+9]
    LDA D, 0x1F76 ; 'v'
    STORE D, [A+10]
    LDA D, 0x1F32 ; '2'
    STORE D, [A+11]
    LDA D, 0x1F2E ; '.'
    STORE D, [A+12]
    LDA D, 0x1F31 ; '1'
    STORE D, [A+13]
    LDA D, 0x1F20 ; ' '
    STORE D, [A+14]
    STORE D, [A+15]

    ; Write "[?=Help]" at right side of header (col 70)
    ; 0xEC00 + 70 = 0xEC46
    LDA A, 0xEC46
    LDA D, 0x1F5B ; '['
    STORE D, [A+0]
    LDA D, 0x1F3F ; '?'
    STORE D, [A+1]
    LDA D, 0x1F3D ; '='
    STORE D, [A+2]
    LDA D, 0x1F48 ; 'H'
    STORE D, [A+3]
    LDA D, 0x1F65 ; 'e'
    STORE D, [A+4]
    LDA D, 0x1F6C ; 'l'
    STORE D, [A+5]
    LDA D, 0x1F70 ; 'p'
    STORE D, [A+6]
    LDA D, 0x1F5D ; ']'
    STORE D, [A+7]

    ; --------------------------------------------------------
    ; BOOT MESSAGES
    ; Set cursor to each row and call print_str (B = string ptr)
    ; --------------------------------------------------------

    ; Row 2 = 0xEC00 + 160 = 0xECA0
    LDA A, CURSOR_VAR
    LDA D, 0xECA0
    STORE D, [A]
    LDA A, STR_INIT
    MOV B, A
    LDA A, print_str
    CALL

    ; Row 3 = 0xEC00 + 240 = 0xECF0
    LDA A, CURSOR_VAR
    LDA D, 0xECF0
    STORE D, [A]
    LDA A, STR_COPY
    MOV B, A
    LDA A, print_str
    CALL

    ; Row 5 = 0xEC00 + 400 = 0xED90
    LDA A, CURSOR_VAR
    LDA D, 0xED90
    STORE D, [A]
    LDA A, STR_MEM
    MOV B, A
    LDA A, print_str
    CALL

    ; Row 6 = 0xEC00 + 480 = 0xEDE0
    LDA A, CURSOR_VAR
    LDA D, 0xEDE0
    STORE D, [A]
    LDA A, STR_VID
    MOV B, A
    LDA A, print_str
    CALL

    ; Row 7 = 0xEC00 + 560 = 0xEE30
    LDA A, CURSOR_VAR
    LDA D, 0xEE30
    STORE D, [A]
    LDA A, STR_KB
    MOV B, A
    LDA A, print_str
    CALL

    ; Row 8 = 0xEC00 + 640 = 0xEE80
    LDA A, CURSOR_VAR
    LDA D, 0xEE80
    STORE D, [A]
    LDA A, STR_DISK
    MOV B, A
    LDA A, print_str
    CALL

    ; Row 9 = 0xEC00 + 720 = 0xEED0
    LDA A, CURSOR_VAR
    LDA D, 0xEED0
    STORE D, [A]
    LDA A, STR_SND
    MOV B, A
    LDA A, print_str
    CALL

    ; Short delay
    LDA A, delay
    CALL

    ; Row 11 = 0xEC00 + 880 = 0xEF70
    LDA A, CURSOR_VAR
    LDA D, 0xEF70
    STORE D, [A]
    LDA A, STR_FS
    MOV B, A
    LDA A, print_str
    CALL

    ; Short delay
    LDA A, delay
    CALL

    ; Row 12 = 0xEC00 + 960 = 0xEFC0
    LDA A, CURSOR_VAR
    LDA D, 0xEFC0
    STORE D, [A]
    LDA A, STR_LOAD
    MOV B, A
    LDA A, print_str
    CALL

    ; Delay before showing ready message
    LDA A, long_delay
    CALL

    ; Row 14 = 0xEC00 + 1120 = 0xF060
    LDA A, CURSOR_VAR
    LDA D, 0xF060
    STORE D, [A]
    LDA A, STR_READY
    MOV B, A
    LDA A, print_str
    CALL

    ; --------------------------------------------------------
    ; Wait for keypress then jump to VM bootstrap
    ; --------------------------------------------------------
wait_key:
    LDA A, 0xFF00         ; keyboard status register
    LOAD D, [A]
    LDI A, 1
    AND D, A              ; bit 0 = key available?
    BRZ wait_key          ; loop until key pressed
    LDA A, 0xFF01         ; read (and consume) the key
    LOAD D, [A]

    LDA A, __vm_boot
    JMP


; ============================================================
; SUBROUTINE: print_str
;
; Prints a null-terminated string to the framebuffer.
; Uses white-on-black (0x0F) color attribute.
;
; Input:  B = address of null-terminated string
;         RAM[CURSOR_VAR] (0x0002) = current cursor position
; Output: RAM[CURSOR_VAR] updated to next write position
; Clobbers: A, D (but saves/restores via stack), B (advances)
; ============================================================
print_str:
    PUSH A
    PUSH D
pstr_loop:
    MOV A, B              ; A = current string pointer
    LOAD D, [A]           ; D = character at that address
    TST D                 ; test D (sets Z if D == 0)
    BRZ pstr_done         ; null terminator -> done
    ; Build colored cell: 0x0F00 | character
    PUSH D                ; save raw character
    LDA D, 0x0F00         ; D = white-on-black attribute
    POP A                 ; A = raw character
    OR D, A               ; D = 0x0F00 | char (colored cell)
    ; Write colored cell to framebuffer at cursor position
    PUSH D                ; save colored cell
    LDA A, CURSOR_VAR     ; A = address of cursor variable
    LOAD A, [A]           ; A = cursor (framebuffer address)
    POP D                 ; D = colored cell
    STORE D, [A]          ; framebuffer[cursor] = colored cell
    INC A                 ; advance cursor (A = cursor + 1)
    ; Save updated cursor back to RAM
    PUSH D                ; save D
    MOV D, A              ; D = new cursor value
    LDA A, CURSOR_VAR     ; A = &cursor
    STORE D, [A]          ; RAM[CURSOR_VAR] = new cursor
    POP D                 ; restore D
    ; Advance string pointer: B = B + 1
    PUSH A                ; save A
    LDI A, 1
    ADD B, A              ; B++ (string pointer advances)
    POP A                 ; restore A
    BRA pstr_loop
pstr_done:
    POP D
    POP A
    RET


; ============================================================
; SUBROUTINE: delay
;
; Busy-wait delay loop (~5000 iterations).
; ============================================================
delay:
    PUSH A
    PUSH D
    LDA D, 5000
dly_loop:
    DEC D
    TST D
    BRP dly_loop
    POP D
    POP A
    RET


; ============================================================
; SUBROUTINE: long_delay
;
; Nested busy-wait (~2 seconds at emulator speed).
; Uses RAM[0x0003] as outer counter to avoid register conflicts
; (DEC pseudo-instruction uses B as scratch).
; ============================================================
.EQU LD_OUTER_VAR, 0x0003
long_delay:
    PUSH A
    PUSH D
    LDA D, 200
    LDA A, LD_OUTER_VAR
    STORE D, [A]
ld_outer:
    LDA D, 30000
ld_inner:
    DEC D
    TST D
    BRP ld_inner
    LDA A, LD_OUTER_VAR
    LOAD D, [A]
    DEC D
    STORE D, [A]
    TST D
    BRP ld_outer
    POP D
    POP A
    RET


; ============================================================
; STRING DATA
; ============================================================

STR_INIT:
    .string "Initializing NexaOS v2.1 ..."

STR_COPY:
  .string "Copyright (c) 2025 Nexa Labs. All rights reserved."

STR_MEM:
    .string "Memory test ..............  64K words       [ OK ]"

STR_VID:
    .string "Video adapter .............  Text 80x30     [ OK ]"

STR_KB:
    .string "Keyboard ......................  PS/2 std   [ OK ]"

STR_DISK:
    .string "Disk controller ...  256 sec x 128 words   [ OK ]"

STR_SND:
    .string "Sound ...................  2ch square wave   [ OK ]"

STR_FS:
  .string "Checking for NexaFS on disk ..."

STR_LOAD:
    .string "Starting kernel ..."

STR_READY:
    .string "Press any key to start NexaOS ..."
</textarea>

        <div class="setup-section" style="flex:0.6">
          <h3>Operativsystem <span class="tag">Nexa</span></h3>
          <textarea id="osEditor" spellcheck="false">// NexaOS — Minimal DOS for Nexa-16 CPU

fn main() {
    poke(0xFF30, 0);
    Disk.init();
    Fs.init();
    var sh: Shell = Shell.new();
    sh.run();
    halt();
}

class Disk {
    static buf: int;

    fn init() {
        buf = Memory.alloc(128);
    }

    fn read(sector: int, dest: int) -> int {
        poke(0xFF52, dest);
        poke(0xFF51, sector);
        poke(0xFF50, 1);
        var timeout: int = 1000;
        while ((peek(0xFF53) & 1) != 0) {
            timeout = timeout - 1;
            if (timeout == 0) { return -1; }
        }
        if ((peek(0xFF53) & 4) != 0) { return -1; }
        return 0;
    }

    fn write(sector: int, src: int) -> int {
        poke(0xFF52, src);
        poke(0xFF51, sector);
        poke(0xFF50, 2);
        var timeout: int = 1000;
        while ((peek(0xFF53) & 1) != 0) {
            timeout = timeout - 1;
            if (timeout == 0) { return -1; }
        }
        if ((peek(0xFF53) & 4) != 0) { return -1; }
        return 0;
    }

    fn getBuf() -> int { return buf; }

    fn readBuf(sector: int) -> int {
        Disk.read(sector, buf);
        return buf;
    }

    fn writeBuf(sector: int) { Disk.write(sector, buf); }

    fn clearBuf() {
        var i: int = 0;
        while (i < 128) { poke(buf + i, 0); i = i + 1; }
    }
}

class Fs {
    static fat: int;
    static dir: int;
    static sec: int;
    static mounted: bool;
    static freeCount: int;

    fn init() {
        fat = Memory.alloc(256);
        dir = Memory.alloc(256);
        sec = Memory.alloc(128);
        mounted = false;
        freeCount = 0;
        Fs.tryMount();
    }

    fn isMounted() -> bool { return mounted; }
    fn fatGet(i: int) -> int { return peek(fat + i); }
    fn fatSet(i: int, v: int) { poke(fat + i, v); }

    fn dirOff(e: int, f: int) -> int {
        var o: int = e + e; o = o + o; o = o + o; o = o + o;
        return o + f;
    }
    fn dirGet(e: int, f: int) -> int { return peek(dir + Fs.dirOff(e, f)); }
    fn dirSet(e: int, f: int, v: int) { poke(dir + Fs.dirOff(e, f), v); }

    fn loadFat() { Disk.read(1, fat); Disk.read(2, fat + 128); }
    fn saveFat() { Disk.write(1, fat); Disk.write(2, fat + 128); }
    fn loadDir() { Disk.read(3, dir); Disk.read(4, dir + 128); }
    fn saveDir() { Disk.write(3, dir); Disk.write(4, dir + 128); }

    fn tryMount() {
        Disk.read(0, sec);
        if (peek(sec) != 0x4844) { mounted = false; return; }
        if (peek(sec + 1) != 2) { mounted = false; return; }
        if ((peek(sec + 3) != 1) | (peek(sec + 5) != 3) | (peek(sec + 7) != 5)) {
            mounted = false; return;
        }
        Fs.loadFat();
        Fs.loadDir();
        mounted = true;
        Fs.countFree();
    }

    fn countFree() {
        freeCount = 0;
        var i: int = 5;
        while (i < 256) {
            if (Fs.fatGet(i) == 0) { freeCount = freeCount + 1; }
            i = i + 1;
        }
    }

    fn getFreeCount() -> int { return freeCount; }
    fn getSec() -> int { return sec; }
    fn fileSize(idx: int) -> int { return Fs.dirGet(idx, 13); }

    fn format() {
        var i: int = 0;
        while (i < 128) { poke(sec + i, 0); i = i + 1; }
        poke(sec, 0x4844);
        poke(sec + 1, 2);
        poke(sec + 2, 256);
        poke(sec + 3, 1);
        poke(sec + 4, 2);
        poke(sec + 5, 3);
        poke(sec + 6, 2);
        poke(sec + 7, 5);
        poke(sec + 8, 251);
        poke(sec + 9, 72);
        poke(sec + 10, 65);
        poke(sec + 11, 67);
        poke(sec + 12, 75);
        poke(sec + 13, 68);
        poke(sec + 14, 79);
        poke(sec + 15, 83);
        Disk.write(0, sec);

        i = 0;
        while (i < 256) { Fs.fatSet(i, 0); i = i + 1; }
        Fs.fatSet(0, 0xFFFE);
        Fs.fatSet(1, 0xFFFE);
        Fs.fatSet(2, 0xFFFE);
        Fs.fatSet(3, 0xFFFE);
        Fs.fatSet(4, 0xFFFE);
        Fs.saveFat();

        i = 0;
        while (i < 256) { poke(dir + i, 0); i = i + 1; }
        Fs.saveDir();

        Disk.clearBuf();
        i = 5;
        while (i < 256) { Disk.writeBuf(i); i = i + 1; }

        mounted = true;
        freeCount = 251;
    }

    fn findFile(n0: int, n1: int, n2: int, n3: int, n4: int, n5: int, n6: int, n7: int, e0: int, e1: int, e2: int) -> int {
        var i: int = 0;
        while (i < 16) {
            if ((Fs.dirGet(i, 11) & 1) != 0) {
                if ((Fs.dirGet(i, 0) == n0) & (Fs.dirGet(i, 1) == n1) &
                    (Fs.dirGet(i, 2) == n2) & (Fs.dirGet(i, 3) == n3) &
                    (Fs.dirGet(i, 4) == n4) & (Fs.dirGet(i, 5) == n5) &
                    (Fs.dirGet(i, 6) == n6) & (Fs.dirGet(i, 7) == n7) &
                    (Fs.dirGet(i, 8) == e0) & (Fs.dirGet(i, 9) == e1) &
                    (Fs.dirGet(i, 10) == e2)) {
                    return i;
                }
            }
            i = i + 1;
        }
        return -1;
    }

    fn createFile(n0: int, n1: int, n2: int, n3: int, n4: int, n5: int, n6: int, n7: int, e0: int, e1: int, e2: int) -> int {
        var existing: int = Fs.findFile(n0, n1, n2, n3, n4, n5, n6, n7, e0, e1, e2);
        if (existing >= 0) { return -2; }
        var i: int = 0;
        while (i < 16) {
            if ((Fs.dirGet(i, 11) & 1) == 0) {
                Fs.dirSet(i, 0, n0); Fs.dirSet(i, 1, n1);
                Fs.dirSet(i, 2, n2); Fs.dirSet(i, 3, n3);
                Fs.dirSet(i, 4, n4); Fs.dirSet(i, 5, n5);
                Fs.dirSet(i, 6, n6); Fs.dirSet(i, 7, n7);
                Fs.dirSet(i, 8, e0); Fs.dirSet(i, 9, e1);
                Fs.dirSet(i, 10, e2); Fs.dirSet(i, 11, 1);
                Fs.dirSet(i, 12, 0); Fs.dirSet(i, 13, 0);
                Fs.dirSet(i, 14, 0); Fs.dirSet(i, 15, 0);
                Fs.saveDir();
                return i;
            }
            i = i + 1;
        }
        return -1;
    }

    fn allocSector() -> int {
        var i: int = 5;
        while (i < 256) {
            if (Fs.fatGet(i) == 0) {
                Fs.fatSet(i, 0xFFFF);
                freeCount = freeCount - 1;
                return i;
            }
            i = i + 1;
        }
        return -1;
    }

    fn freeChain(s: int) {
        while ((s > 0) & (s < 256)) {
            var nxt: int = Fs.fatGet(s);
            Fs.fatSet(s, 0);
            freeCount = freeCount + 1;
            if ((nxt == 0) | (nxt == 0xFFFF) | (nxt == 0xFFFE)) { return; }
            s = nxt;
        }
    }

    fn deleteFile(idx: int) {
        var startSec: int = Fs.dirGet(idx, 12);
        if (startSec > 0) { Fs.freeChain(startSec); Fs.saveFat(); }
        Fs.dirSet(idx, 11, 0);
        Fs.saveDir();
    }

    fn writeFileData(idx: int, buf: int, len: int) -> int {
        var oldStart: int = Fs.dirGet(idx, 12);

        if (len == 0) {
            Fs.dirSet(idx, 12, 0);
            Fs.dirSet(idx, 13, 0);
            if (oldStart > 0) { Fs.freeChain(oldStart); }
            Fs.saveFat(); Fs.saveDir();
            return 0;
        }

        var firstSec: int = Fs.allocSector();
        if (firstSec < 0) { return -1; }

        var curSec: int = firstSec;
        var pos: int = 0;
        var secPos: int = 0;

        while (pos < len) {
            poke(sec + secPos, peek(buf + pos));
            secPos = secPos + 1;
            pos = pos + 1;

            if ((secPos >= 128) | (pos >= len)) {
                while (secPos < 128) { poke(sec + secPos, 0); secPos = secPos + 1; }
                Disk.write(curSec, sec);
                secPos = 0;
                if (pos < len) {
                    var newSec: int = Fs.allocSector();
                    if (newSec < 0) {
                        Fs.freeChain(firstSec);
                        Fs.saveFat();
                        return -1;
                    }
                    Fs.fatSet(curSec, newSec);
                    curSec = newSec;
                }
            }
        }

        Fs.dirSet(idx, 12, firstSec);
        Fs.dirSet(idx, 13, len);
        if (oldStart > 0) { Fs.freeChain(oldStart); }
        Fs.saveFat(); Fs.saveDir();
        return 0;
    }

    fn readFileData(idx: int, buf: int, maxLen: int) -> int {
        var size: int = Fs.dirGet(idx, 13);
        var startSec: int = Fs.dirGet(idx, 12);
        if ((size == 0) | (startSec == 0)) { return 0; }
        var curSec: int = startSec;
        var pos: int = 0;
        var limit: int = size;
        if (limit > maxLen) { limit = maxLen; }
        while ((pos < limit) & (curSec > 0) & (curSec < 256)) {
            Disk.read(curSec, sec);
            var i: int = 0;
            while ((i < 128) & (pos < limit)) {
                poke(buf + pos, peek(sec + i));
                pos = pos + 1; i = i + 1;
            }
            var nxt: int = Fs.fatGet(curSec);
            if ((nxt == 0xFFFF) | (nxt == 0) | (nxt == 0xFFFE)) { curSec = 0; }
            else { curSec = nxt; }
        }
        return pos;
    }
}

class Shell {
    field buf: Array;
    field len: int;
    field pname: Array;
    field pext: Array;
    field fbuf: int;

    new() {
        this.buf = Array.new(82);
        this.len = 0;
        this.pname = Array.new(8);
        this.pext = Array.new(3);
        this.fbuf = Memory.alloc(512);
        Shell.drawHeader();
        this.printBanner();
    }

    fn drawHeader() {
        var i: int = 0;
        while (i < 2400) { poke(0xEC00 + i, 0x0720); i = i + 1; }
        i = 0;
        while (i < 80) { poke(0xEC00 + i, 0x1F20); i = i + 1; }
        // "NexaOS" at center
        poke(0xEC00 + 36, 0x1F48);
        poke(0xEC00 + 37, 0x1F61);
        poke(0xEC00 + 38, 0x1F63);
        poke(0xEC00 + 39, 0x1F6B);
        poke(0xEC00 + 40, 0x1F44);
        poke(0xEC00 + 41, 0x1F4F);
        poke(0xEC00 + 42, 0x1F53);
        Output.moveCursor(1, 0);
    }

    method printBanner() {
        Output.println();
        Output.printString("NexaOS v2.1 [Nexa-16]");
        Output.println();
        if (Fs.isMounted()) {
            Output.printInt(Fs.getFreeCount());
            Output.printString(" sectors free");
        } else {
            Output.printString("No FS. Type FORMAT");
        }
        Output.println();
        Output.printString("Type ? for help");
        Output.println();
        Output.println();
    }

    method run() {
        loop {
            this.printPrompt();
            this.readLine();
            if (this.len > 0) { this.execCommand(); }
        }
    }

    method printPrompt() {
        Output.printChar(0x0A00 | 67); Output.printChar(0x0A00 | 58);
        Output.printChar(0x0A00 | 92); Output.printChar(0x0A00 | 62);
        Output.printChar(32);
    }

    method readLine() {
        this.len = 0;
        loop {
            var c: int = Keyboard.readChar();
            if (c == 10) { Output.println(); break; }
            else {
                if (c == 8) { if (this.len > 0) { this.len = this.len - 1; Output.backSpace(); } }
                else {
                    if ((c > 31) & (c < 127) & (this.len < 80)) {
                        this.buf[this.len] = c; this.len = this.len + 1; Output.printChar(c);
                    }
                }
            }
        }
        this.buf[this.len] = 0;
    }

    method upcase(c: int) -> int {
        if ((c > 96) & (c < 123)) { return c - 32; }
        return c;
    }

    method argStart() -> int {
        var i: int = 0;
        while ((i < this.len) & (this.buf[i] != 32)) { i = i + 1; }
        while ((i < this.len) & (this.buf[i] == 32)) { i = i + 1; }
        return i;
    }

    method parseFilename(start: int) -> bool {
        var i: int = 0;
        while (i < 8) { this.pname[i] = 32; i = i + 1; }
        i = 0;
        while (i < 3) { this.pext[i] = 32; i = i + 1; }
        var pos: int = start;
        var ni: int = 0;
        while ((pos < this.len) & (this.buf[pos] == 32)) { pos = pos + 1; }
        if (pos >= this.len) { return false; }
        while ((pos < this.len) & (this.buf[pos] != 46) & (this.buf[pos] != 32)) {
            var uc: int = this.upcase(this.buf[pos]);
            if (ni < 8) { this.pname[ni] = uc; ni = ni + 1; }
            pos = pos + 1;
        }
        if (ni == 0) { return false; }
        if ((pos < this.len) & (this.buf[pos] == 46)) {
            pos = pos + 1;
            var ei: int = 0;
            while ((pos < this.len) & (this.buf[pos] != 32)) {
                var ec: int = this.upcase(this.buf[pos]);
                if (ei < 3) { this.pext[ei] = ec; ei = ei + 1; }
                pos = pos + 1;
            }
        }
        return true;
    }

    method findParsedFile() -> int {
        return Fs.findFile(this.pname[0], this.pname[1], this.pname[2], this.pname[3],
            this.pname[4], this.pname[5], this.pname[6], this.pname[7],
            this.pext[0], this.pext[1], this.pext[2]);
    }

    method createParsedFile() -> int {
        return Fs.createFile(this.pname[0], this.pname[1], this.pname[2], this.pname[3],
            this.pname[4], this.pname[5], this.pname[6], this.pname[7],
            this.pext[0], this.pext[1], this.pext[2]);
    }

    method printDirName(idx: int) {
        var i: int = 0;
        while (i < 8) { var c: int = Fs.dirGet(idx, i); if (c != 32) { Output.printChar(c); } i = i + 1; }
        Output.printChar(46);
        i = 8;
        while (i < 11) { var c2: int = Fs.dirGet(idx, i); if (c2 != 32) { Output.printChar(c2); } i = i + 1; }
    }

    method requireFs() -> bool {
        if (!Fs.isMounted()) { Output.printString("No FS"); Output.println(); return false; }
        return true;
    }

    method parseHex(start: int) -> int {
        var i: int = start;
        var result: int = 0;
        while ((i < this.len) & (this.buf[i] == 32)) { i = i + 1; }
        if ((i + 1 < this.len) & (this.buf[i] == 48) & (this.upcase(this.buf[i + 1]) == 88)) { i = i + 2; }
        while (i < this.len) {
            var c: int = this.upcase(this.buf[i]);
            if ((c >= 48) & (c <= 57)) { result = (result << 4) | (c - 48); }
            else { if ((c >= 65) & (c <= 70)) { result = (result << 4) | (c - 55); } else { break; } }
            i = i + 1;
        }
        return result;
    }

    method printHex(val: int) {
        var i: int = 3;
        while (i > -1) {
            var shift: int = i * 4;
            var nibble: int = (val >> shift) & 15;
            if (nibble < 10) { Output.printChar(48 + nibble); } else { Output.printChar(55 + nibble); }
            i = i - 1;
        }
    }

    method execCommand() {
        var c0: int = this.upcase(this.buf[0]);
        var c1: int = 0;
        if (this.len > 1) { c1 = this.upcase(this.buf[1]); }
        if (c0 == 63) { this.cmdHelp(); }
        else if ((c0 == 67) & (c1 == 76)) { this.cmdCls(); }
        else if ((c0 == 67) & (c1 == 82)) { this.cmdCreate(); }
        else if ((c0 == 68) & (c1 == 73)) { this.cmdDir(); }
        else if ((c0 == 68) & (c1 == 69)) { this.cmdDel(); }
        else if ((c0 == 69) & (c1 == 67)) { this.cmdEcho(); }
        else if ((c0 == 70) & (c1 == 79)) { this.cmdFormat(); }
        else if ((c0 == 72) & (c1 == 65)) { this.cmdHalt(); }
        else if ((c0 == 72) & (c1 == 69)) { this.cmdHelp(); }
        else if ((c0 == 77) & (c1 == 79)) { this.cmdMount(); }
        else if ((c0 == 80) & (c1 == 69)) { this.cmdPeek(); }
        else if ((c0 == 80) & (c1 == 79)) { this.cmdPoke(); }
        else if ((c0 == 82) & (c1 == 85)) { this.cmdRun(); }
        else if ((c0 == 84) & (c1 == 89)) { this.cmdType(); }
        else if ((c0 == 87) & (c1 == 82)) { this.cmdWrite(); }
        else { Output.printString("Bad cmd"); Output.println(); }
    }

    method cmdHelp() {
        Output.printString("RUN DIR TYPE CREATE WRITE DEL");
        Output.println();
        Output.printString("FORMAT MOUNT CLS ECHO PEEK POKE HALT");
        Output.println();
    }

    method cmdCls() {
        var i: int = 0;
        while (i < 2400) { poke(0xEC00 + i, 0x0720); i = i + 1; }
        Shell.drawHeader();
    }

    method cmdEcho() {
        var i: int = this.argStart();
        while (i < this.len) { Output.printChar(this.buf[i]); i = i + 1; }
        Output.println();
    }

    method cmdDir() {
        if (!this.requireFs()) { return; }
        var count: int = 0;
        var i: int = 0;
        while (i < 16) {
            if ((Fs.dirGet(i, 11) & 1) != 0) {
                Output.printString("  ");
                this.printDirName(i);
                Output.printString("  ");
                Output.printInt(Fs.dirGet(i, 13));
                Output.println();
                count = count + 1;
            }
            i = i + 1;
        }
        Output.printInt(count);
        Output.printString(" file(s) ");
        Output.printInt(Fs.getFreeCount());
        Output.printString(" free");
        Output.println();
    }

    method cmdType() {
        if (!this.requireFs()) { return; }
        var a: int = this.argStart();
        if (a >= this.len) { return; }
        if (!this.parseFilename(a)) { return; }
        var idx: int = this.findParsedFile();
        if (idx < 0) { Output.printString("Not found"); Output.println(); return; }
        var sz: int = Fs.dirGet(idx, 13);
        if (sz == 0) { return; }
        var curSec: int = Fs.dirGet(idx, 12);
        var printed: int = 0;
        var secBuf: int = Fs.getSec();
        while ((curSec > 0) & (curSec < 256) & (printed < sz)) {
            Disk.read(curSec, secBuf);
            var j: int = 0;
            while ((j < 128) & (printed < sz)) {
                var ch: int = peek(secBuf + j);
                if (ch == 10) { Output.println(); }
                else if ((ch > 31) & (ch < 127)) { Output.printChar(ch); }
                printed = printed + 1; j = j + 1;
            }
            var nxt: int = Fs.fatGet(curSec);
            if ((nxt == 0xFFFF) | (nxt == 0) | (nxt == 0xFFFE)) { curSec = 0; }
            else { curSec = nxt; }
        }
        Output.println();
    }

    method cmdCreate() {
        if (!this.requireFs()) { return; }
        var a: int = this.argStart();
        if (a >= this.len) { return; }
        if (!this.parseFilename(a)) { return; }
        var r: int = this.createParsedFile();
        if (r == -2) { Output.printString("Exists"); }
        else if (r == -1) { Output.printString("Dir full"); }
        else { Output.printString("OK"); }
        Output.println();
    }

    method cmdWrite() {
        if (!this.requireFs()) { return; }
        var a: int = this.argStart();
        if (a >= this.len) { return; }
        if (!this.parseFilename(a)) { return; }
        var idx: int = this.findParsedFile();
        if (idx < 0) {
            idx = this.createParsedFile();
            if (idx < 0) { return; }
        }
        Output.printString(". to end");
        Output.println();
        var wlen: int = 0;
        loop {
            this.readLine();
            if ((this.len == 1) & (this.buf[0] == 46)) { break; }
            if (wlen + this.len + 1 > 500) { break; }
            var i: int = 0;
            while (i < this.len) { poke(this.fbuf + wlen, this.buf[i]); wlen = wlen + 1; i = i + 1; }
            poke(this.fbuf + wlen, 10); wlen = wlen + 1;
        }
        Fs.writeFileData(idx, this.fbuf, wlen);
        Output.printString("Saved ");
        Output.printInt(wlen);
        Output.println();
    }

    method cmdDel() {
        if (!this.requireFs()) { return; }
        var a: int = this.argStart();
        if (a >= this.len) { return; }
        if (!this.parseFilename(a)) { return; }
        var idx: int = this.findParsedFile();
        if (idx < 0) { Output.printString("Not found"); Output.println(); return; }
        Output.printString("Y/N? ");
        var key: int = Keyboard.readChar();
        Output.printChar(key); Output.println();
        if ((key == 89) | (key == 121)) {
            Fs.deleteFile(idx);
            Output.printString("OK"); Output.println();
        }
    }

    method cmdFormat() {
        Output.printString("Erase disk? Y/N ");
        var key: int = Keyboard.readChar();
        Output.printChar(key); Output.println();
        if ((key != 89) & (key != 121)) { return; }
        Fs.format();
        Output.printString("Done. 251 free");
        Output.println();
    }

    method cmdPeek() {
        var a: int = this.argStart();
        var addr: int = this.parseHex(a);
        this.printHex(peek(addr));
        Output.println();
    }

    method cmdPoke() {
        var a: int = this.argStart();
        var addr: int = this.parseHex(a);
        var i: int = a;
        while ((i < this.len) & (this.buf[i] != 32)) { i = i + 1; }
        var val: int = this.parseHex(i);
        poke(addr, val);
    }

    method cmdRun() {
        if (!this.requireFs()) { return; }
        var a: int = this.argStart();
        if (a >= this.len) { Output.printString("Usage: RUN file"); Output.println(); return; }
        if (!this.parseFilename(a)) { return; }
        var idx: int = this.findParsedFile();
        if (idx < 0) { Output.printString("Not found"); Output.println(); return; }
        var sz: int = Fs.dirGet(idx, 13);
        if (sz == 0) { Output.printString("Empty file"); Output.println(); return; }
        // Build sector list at 0xEE00 for boot controller
        var curSec: int = Fs.dirGet(idx, 12);
        var count: int = 0;
        while ((curSec > 0) & (curSec < 256) & (count < 251)) {
            poke(0xEE01 + count, curSec);
            count = count + 1;
            var nxt: int = Fs.fatGet(curSec);
            if ((nxt == 0xFFFF) | (nxt == 0) | (nxt == 0xFFFE)) { curSec = 0; }
            else { curSec = nxt; }
        }
        poke(0xEE00, count);
        Output.printString("Loading ");
        Output.printInt(sz);
        Output.printString(" words...");
        Output.println();
        // Write exec magic — boot controller will load sectors to RAM[0] and restart CPU
        poke(0xEEFF, sz);
        poke(0xEEFE, 0x4558);
        halt();
    }

    method cmdMount() {
        Fs.tryMount();
        if (Fs.isMounted()) {
            Output.printInt(Fs.getFreeCount());
            Output.printString(" sectors free");
        } else {
            Output.printString("No FS");
        }
        Output.println();
    }

    method cmdHalt() {
        Output.printString("Halted");
        Output.println();
        halt();
    }

// --- SymbolTable ---
var SymbolTable = class {
  constructor() { this.classScope=new Map(); this.subroutineScope=new Map(); this.indices={'static':0,'field':0,'argument':0,'var':0}; }

// --- CodeGenerator ---

<script>
// Utility functions
var escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
var hex = (n, width = 4) => (n & 65535).toString(16).toUpperCase().padStart(width, "0");
var bin16 = (n) => (n & 65535).toString(2).padStart(16, "0");
var parseFlexibleNumber = (s) => {
  if (!s) return null;
  const t = String(s).trim();
  if (/^0x[0-9a-f]+$/i.test(t)) return parseInt(t, 16) & 65535;
  if (/^0b[01]+$/i.test(t)) return parseInt(t.slice(2), 2) & 65535;
  if (/^-?\d+$/.test(t)) return parseInt(t, 10) & 65535;
  return null;
};
var asciiFromKey = (event) => {
  if (event.key.length === 1) return event.key.charCodeAt(0) & 255;
  if (event.key === "Enter") return 10;
  if (event.key === "Backspace") return 8;
  if (event.key === "Tab") return 9;
  if (event.key === "Escape") return 27;
  return null;
};

<script>
// os-boot.js — NexaOS Boot: links bootloader ASM + Nexa OS, assembles, and runs
(function() {
  "use strict";

  // --- DOM refs ---
  var bootloaderEditor = document.getElementById("bootloaderEditor");
  var osEditor = document.getElementById("osEditor");
  var bootBtn = document.getElementById("bootBtn");
  var resetBtn = document.getElementById("resetBtn");
  var pauseBtn = document.getElementById("pauseBtn");
  var resumeBtn = document.getElementById("resumeBtn");
  var importBootBtn = document.getElementById("importBootBtn");
  var importOsBtn = document.getElementById("importOsBtn");
  var toggleSetupBtn = document.getElementById("toggleSetup");
  var screen = document.getElementById("screen");
  var statusEl = document.getElementById("status");
  var errorPanel = document.getElementById("errorPanel");
  var setupPanel = document.getElementById("setupPanel");
  var speedEl = document.getElementById("speed");

  // --- Graphics setup (same as app.js) ---
  var gfxCtx = screen.getContext("2d");
  var gfxImgData = gfxCtx.createImageData(640, 480);
  var gfxBuf32 = new Uint32Array(gfxImgData.data.buffer);
  var palette32 = new Uint32Array(16);
  for (var pi = 0; pi < 16; pi++) {
    var c = PALETTE[pi];
    var r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
    palette32[pi] = 0xFF000000 | (b << 16) | (g << 8) | r;
  }

  function renderFbText(fb) {
    var buf = gfxBuf32, pal = palette32, font = FONT_8X8;
    for (var row = 0; row < 30; row++) {
      var fbRowOff = row * 80, screenRowBase = row * 16 * 640;
      for (var col = 0; col < 80; col++) {
        var word = fb[fbRowOff + col];
        var bgC = pal[(word >> 12) & 15], fgC = pal[(word >> 8) & 15];
        var ch = word & 255;
        var fontBase = ch < 128 ? ch * 8 : -1;
        var colBase = screenRowBase + col * 8;
        for (var py = 0; py < 8; py++) {
          var fb2 = fontBase >= 0 ? font[fontBase + py] : 0;
          var off = colBase + py * 2 * 640;
          buf[off]     = fb2 & 128 ? fgC : bgC;
          buf[off + 1] = fb2 & 64  ? fgC : bgC;
          buf[off + 2] = fb2 & 32  ? fgC : bgC;
          buf[off + 3] = fb2 & 16  ? fgC : bgC;
          buf[off + 4] = fb2 & 8   ? fgC : bgC;
          buf[off + 5] = fb2 & 4   ? fgC : bgC;
          buf[off + 6] = fb2 & 2   ? fgC : bgC;
          buf[off + 7] = fb2 & 1   ? fgC : bgC;
          var off2 = off + 640;
          buf[off2]     = buf[off];
          buf[off2 + 1] = buf[off + 1];
          buf[off2 + 2] = buf[off + 2];
          buf[off2 + 3] = buf[off + 3];
          buf[off2 + 4] = buf[off + 4];
          buf[off2 + 5] = buf[off + 5];
          buf[off2 + 6] = buf[off + 6];
          buf[off2 + 7] = buf[off + 7];
        }
      }
    }
    gfxCtx.putImageData(gfxImgData, 0, 0);
  }

  function renderFbPixel(fb) {
    var buf = gfxBuf32, pal = palette32;
    for (var y = 0; y < 120; y++) {
      var fbRow = y * 40, screenBase = y * 4 * 640;
      for (var xWord = 0; xWord < 40; xWord++) {
        var word = fb[fbRow + xWord];
        var c0 = pal[word >> 12 & 15], c1 = pal[word >> 8 & 15];
        var c2 = pal[word >> 4 & 15], c3 = pal[word & 15];
        var baseX = xWord * 16;
        for (var dy = 0; dy < 4; dy++) {
          var rr = screenBase + dy * 640 + baseX;
          buf[rr]=c0;buf[rr+1]=c0;buf[rr+2]=c0;buf[rr+3]=c0;
          buf[rr+4]=c1;buf[rr+5]=c1;buf[rr+6]=c1;buf[rr+7]=c1;
          buf[rr+8]=c2;buf[rr+9]=c2;buf[rr+10]=c2;buf[rr+11]=c2;
          buf[rr+12]=c3;buf[rr+13]=c3;buf[rr+14]=c3;buf[rr+15]=c3;
        }
      }
    }
    gfxCtx.putImageData(gfxImgData, 0, 0);
  }

  // --- State ---
  var running = false;
  var displayMode = 0;
  var lastFb = new Uint16Array(4800);
  var keyboardQueue = [];
  var wKbSt = 0;
  var rafId = 0;
  var pendingRender = false;

  // --- Worker ---
  var emuWorkerCodeEl = document.getElementById("emuWorkerCode");
  var emuWorkerBlob = new Blob([emuWorkerCodeEl.textContent], { type: "text/javascript" });
  var emuWorkerUrl = URL.createObjectURL(emuWorkerBlob);
  var emu = new Worker(emuWorkerUrl);

  emu.onmessage = function(e) {
    var msg = e.data;
    switch (msg.t) {
      case "snap":
        lastFb = new Uint16Array(msg.fb);
        displayMode = msg.dm;
        wKbSt = msg.ks;
        if (msg.u && msg.u.length > 0) { /* UART output — could show in a console panel */ }
        if (running) {
          pendingRender = true;
          if (!rafId) rafId = requestAnimationFrame(renderFrame);
        } else {
          renderScreen();
        }
        break;
      case "stop":
        running = false;
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
        pendingRender = false;
        if (msg.reason === "halted") setStatus("CPU stoppet (HALT).");
        else setStatus("Pauset.");
        renderScreen();
        break;
      case "dm":
        displayMode = msg.mode;
        break;
    }
  };

  function renderScreen() {
    if (displayMode === 0) renderFbText(lastFb); else renderFbPixel(lastFb);
  }

  function renderFrame() {
    rafId = 0;
    if (pendingRender) { renderScreen(); pendingRender = false; }
    if (running) rafId = requestAnimationFrame(renderFrame);
  }

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (isError ? " error" : "");
  }

  function showErrors(text) {
    errorPanel.textContent = text;
    errorPanel.classList.toggle("visible", !!text);
  }

  function importTextFile(file, targetEditor, label) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      targetEditor.value = String(reader.result || "").replace(/^\uFEFF/, "");
      showErrors("");
      setStatus(label + " importert: " + file.name);
    };
    reader.onerror = function() {
      setStatus("Kunne ikke lese " + label + ".", true);
    };
    reader.readAsText(file, "utf-8");
  }

  // --- Keyboard input → emulator ---
  function pumpInputQueue() {
    if (!keyboardQueue.length) return;
    if (wKbSt === 0) {
      var ascii = keyboardQueue.shift();
      emu.postMessage({t: "key", a: ascii});
    }
  }
  setInterval(function() { if (running) pumpInputQueue(); }, 50);

  screen.addEventListener("keydown", function(ev) {
    var ascii = asciiFromKey(ev);
    if (ascii !== null) { keyboardQueue.push(ascii); pumpInputQueue(); ev.preventDefault(); }

   * Compiles Nexa OS to assembly, prepends the bootloader ASM,
   * generates the VM bootstrap, assembles everything into machine code.
   *
   * Memory layout:
   *   [0x0000 ...] Bootloader ASM
   *   [continued ]  __vm_boot: VM bootstrap (sets SP, base ptrs, calls Main.main)
   *   [continued ]  Nexa stdlib + OS compiled assembly

  function compileAndLink(bootloaderSrc, osSrc) {
    showErrors("");

    var vmCode;

      var parser = new Parser(osSrc);
      var ast = parser.parse();
      var codegen = new CodeGenerator();
      vmCode = codegen.generate(ast, "Main");

      return { success: false, error: "Nexa kompileringsfeil:\n" + e.message };
    }

    var vmResult = vmTranslator.translate(fullVM, "Main");
    if (!vmResult.success) {
      return { success: false, error: "VM-oversetterfeil:\n" + vmResult.errors.join("\n") };
    }

    var vmBootstrap = [
      "",
      "; === VM Bootstrap (auto-generated) ===",
      "__vm_boot:",
      "    LDA SP, 0xEBF0",
      "",
      "    LDA A, 1",
      "    LDA D, 0xEBF0",
      "    STORE D, [A+0]",
      "    LDA A, 2",
      "    STORE D, [A+0]",
      "",
      "    LDA D, __vm_halt",
      "    PUSH D",
      "    LDA D, 0xEBF0",
      "    PUSH D",
      "    PUSH D",
      "    LDI D, 0",
      "    PUSH D",
      "    PUSH D",
      "",
      "    MOV D, SP",
      "    PUSH B",
      "    LDI B, 4",
      "    ADD D, B",
      "    LDA A, 2",
      "    STORE D, [A+0]",
      "    POP B",
      "",
      "    MOV D, SP",
      "    LDA A, 1",
      "    STORE D, [A+0]",
      "",
      "    LDA A, Main.main",
      "    JMP",
      "__vm_halt:",
      "    HALT",
      ""
    ].join("\n");

    // 4. Concatenate: bootloader ASM + VM bootstrap + compiled Nexa ASM
    var fullAssembly = bootloaderSrc + "\n" + vmBootstrap + "\n" + vmResult.assembly;

    // 5. Assemble
    var assembler = new Assembler();
    var asmResult = assembler.assemble(fullAssembly);
    if (!asmResult.success) {
      return { success: false, error: "Assembly-feil:\n" + asmResult.errors.join("\n") };
    }

    return { success: true, code: asmResult.code, symbols: asmResult.symbols, fullAssembly: fullAssembly };
  }

  // --- Boot ---
  function boot() {
    var bootloaderSrc = bootloaderEditor.value;
    var osSrc = osEditor.value;

    setStatus("Kompilerer og linker...");
    var result = compileAndLink(bootloaderSrc, osSrc);

    if (!result.success) {
      setStatus("Kompilering feilet.", true);
      showErrors(result.error);
      return;
    }

    showErrors("");

    // Reset and load
    var buf = result.code.buffer.slice(0);
    emu.postMessage({t: "load", code: buf}, [buf]);

    // Collapse setup panel and focus screen
    setupPanel.classList.add("collapsed");
    toggleSetupBtn.textContent = "\u25B6";

    // Run
    running = true;
    keyboardQueue = [];
    var speed = Number(speedEl.value) || 500000;
    emu.postMessage({t: "run", speed: speed});
    if (!rafId) rafId = requestAnimationFrame(renderFrame);
    setStatus("NexaOS bootet — " + result.code.length + " ord lastet. Klikk skjermen for tastaturinput.");
    screen.focus();
  }

  // --- Controls ---
  bootBtn.addEventListener("click", boot);

  function pickTextFile(accept, label, onFile) {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = accept;
    input.style.position = "fixed";
    input.style.left = "-9999px";
    input.style.top = "-9999px";
    document.body.appendChild(input);
    input.addEventListener("change", function() {
      try {
        var file = input.files && input.files[0];
        if (file) onFile(file);
      } finally {
        document.body.removeChild(input);
      }
    }, { once: true });
    input.click();
  }

  importBootBtn.addEventListener("click", function(ev) {
    ev.preventDefault();
    ev.stopPropagation();
    pickTextFile(".asm,.txt", "boot.asm", function(file) {
      importTextFile(file, bootloaderEditor, "boot.asm");
    });
  });

  importOsBtn.addEventListener("click", function(ev) {
    ev.preventDefault();
    ev.stopPropagation();
    pickTextFile(".nx,.txt", "nexaos.nx", function(file) {
      importTextFile(file, osEditor, "nexaos.nx");
    });
  });

  resetBtn.addEventListener("click", function() {
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    emu.postMessage({t: "reset"});
    keyboardQueue = [];
    setStatus("Maskinen nullstilt. Klikk Boot for å starte.");
    renderScreen();
  });

  pauseBtn.addEventListener("click", function() {
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    emu.postMessage({t: "pause"});
    setStatus("Pauset.");
  });

  resumeBtn.addEventListener("click", function() {
    running = true;
    var speed = Number(speedEl.value) || 500000;
    emu.postMessage({t: "run", speed: speed});
    if (!rafId) rafId = requestAnimationFrame(renderFrame);
    setStatus("Kjører...");
    screen.focus();
  });

  toggleSetupBtn.addEventListener("click", function() {
    var collapsed = setupPanel.classList.toggle("collapsed");
    toggleSetupBtn.textContent = collapsed ? "\u25B6" : "\u25C0";
  });

  speedEl.addEventListener("input", function() {
    emu.postMessage({t: "spd", v: Number(speedEl.value)});
  });

  // Clean up on page close
  window.addEventListener("beforeunload", function() { emu.terminate(); URL.revokeObjectURL(emuWorkerUrl); });

  // Initial render
  renderScreen();
  setStatus("Klar. Rediger bootloader og OS-kode, klikk deretter Boot.");

})();

</script>

</body>
</html>
